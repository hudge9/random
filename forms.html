<!DOCTYPE html>
<html>
    <head>
        <title>im really good at making forms👍</title>
    </head>
    <body>
        <form action="https://formsubmit.co/597816a009a4276c22b8e65c8a316da7" method="post" enctype="multipart/form-data">
            <label for="name">enter your name:</label>
            <input type="text" id="name" minlength="3" maxlength="12" placeholder="Chris Hemsworth" required>
            <br><br>

            <label for="enter_code">enter the code:</label>
            <input type="password" id="enter_code" minlength="6" placeholder="**********" required>
            <br><br>

            <label for="email">enter your email:</label>
            <input type="email" id="email" minlength="6" placeholder="example@gmail.com" required>
            <br><br>

            <label for="phone">phone number:</label>
            <input type="tel" id="phone" minlength="10" maxlength="12" placeholder="123-456-7890" pattern="{0-9}{3}-{0-9}{3}-{0-9}{4}" required>
            <br><br>

            <label for="bday">enter your birthday:</label>
            <input type="date" id="bday" required>
            <br><br>

            <label for="title">enter your title:</label>

            <label for="Mr.">Mr.</label>
            <input type="radio" id="Mr." name="title" value="Mr.">
            <label for="Ms.">Mrs.</label>
            <input type="radio" id="Ms." name="title" value="Ms.">
            <label for="Mx.">Mx.</label>
            <input type="radio" id="Mx." name="title" value="Mx.">
            <label for="Dr.">Dr.</label>
            <input type="radio" id="Dr." name="title" value="Dr.">
            <br><br>

            <label for="color1">choose a color:</label>
            <input type="color" id="color1" required>
            <br><br>

            <label for="color2">choose another color:</label>
            <input type="color" id="color2" required>
            <br><br>

            <label for="color3">choose one more color:</label>
            <input type="color" id="color3" required>
            <br><br>

            <label for="file">upload a file:</label>
            <input type="file" id="file" accept=".jpg, .png, .pdf, .wav, .mp3, .mp4">
            <br><br>

            <input type="button" value="click me!" onclick="alert('you clicked me!')" id="button">
            <br><br>

            <label for="">pick what you want your profile pic to be:</label>
            <br><br>
            <label for="fruit1">apple</label>
            <input type="checkbox" id="fruit1">
            <br><br>

            <input type="checkbox" id="fruit2">
            <label for="fruit2">banana</label>
            <br><br>

            <label for="datetime">enter your date and time:</label>
            <input type="datetime" id="datetime" required>
            <br><br>

            <label for="datetime-local">enter your local date and time:</label>
            <input type="datetime-local" id="datetime-local" required>
            <br><br>

            <label for="month">enter your month:</label required>
            <input type="month" id="month" required>
            <br><br>

            <label for="time">enter your time:</label required>
            <input type="time" id="time" required>
            <br><br>

            <label for="week">enter your week:</label required>
            <input type="week" id="week" required>
            <br><br>

            <label for="url">enter your website URL:</label required>
            <input type="url" id="url" required>
            <br><br>

            <label for="country">select your country:</label required>
            <select name="country" id="country">
                <option value="usa">United States</option>
                <option value="canada">Canada</option>
                <option value="uk">United Kingdom</option>
                <option value="australia">Australia</option>
                <option value="other">Other</option>
            </select>
            <br><br>

            <label for="comment">make a comment:</label>
            <textarea name="" id="comment"></textarea>

            <input type="reset" id="reset">
            <input type="submit" id="submit">
        </form>
    </body>
</html>
